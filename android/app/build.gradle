apply plugin: 'com.android.application'

android {
    namespace 'com.deskduel.penfight'
    compileSdk 35

    defaultConfig {
        applicationId "com.deskduel.penfight"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pure native android: zero dependencies required! MainActivity extends android.app.Activity
}
