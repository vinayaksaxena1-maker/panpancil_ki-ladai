<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>Pen Fight &middot; The Unofficial Sport of the Last Bench</title>
  <meta name="description" content="Classic Indian school pen fight game with nostalgic pens, authentic desk physics, and fair play." />
  <meta name="theme-color" content="#c4691a" />
  <meta name="color-scheme" content="dark" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a140e;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #app {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    .humancheckpaper, [class*="humancheck"] {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
  </style>
  <script>
    // Native Haptic Bridge & Safe Fallback
    window.__pfHaptic = function(intensity) {
      try {
        if (window.__pfNativeBridge && window.__pfNativeBridge.postMessage) {
          window.__pfNativeBridge.postMessage('haptic:' + (intensity || 'medium'));
        }
      } catch (e) {}
    };

    // Listen to touch releases / flick actions to vibrate native hardware
    window.addEventListener('touchend', function() {
      window.__pfHaptic('light');
    }, { passive: true });

    // Dynamic School Mod Modifier (Coin on Cap, Rubber Grip, etc.)
    window.__currentPenMod = { mass: 1.0, friction: 1.0 };
    window.__applyPenMod = function(massMult, frictionMult) {
      window.__currentPenMod = { mass: massMult || 1.0, friction: frictionMult || 1.0 };
      console.log('[Pen Mod Active]', window.__currentPenMod);
    };

    // Global error suppressor for unowned backend to ensure 0 crash rate
    window.addEventListener('error', function(event) {
      if (event.message && (event.message.includes('supabase') || event.message.includes('fetch') || event.message.includes('network'))) {
        console.warn('[Offline Mode Guard]', event.message);
        event.preventDefault();
      }
    });
  </script>
